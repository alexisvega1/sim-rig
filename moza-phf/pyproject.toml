[project]
name = "moza-phf"
version = "0.0.1"
description = "MOZA Pedal Haptic Feedback (PHF) on Linux: protocol tools, capture diff, telemetry-driven driver"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
moza-phf = "moza_phf.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["moza_phf*"]
